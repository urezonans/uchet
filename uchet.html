<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт клиентов и проектов</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background: #f7f7f7; color: #222; }
    h2 { margin-bottom: 8px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    input, select, textarea, button { padding: 6px 8px; font-size: 14px; }
    button { cursor: pointer; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #ddd; padding: 6px; vertical-align: top; }
    th { background: #f0f0f0; text-align: left; font-size: 13px; }
    td input { width: 100%; box-sizing: border-box; border: 1px solid transparent; background: transparent; }
    td input:focus { border-color: #888; background: white; outline: none; }
    .muted { color: #777; font-size: 13px; }
    .client-link { width: 100%; min-height: 28px; border: 1px dashed #b7d4ff; background: #f4f9ff; color: #004a99; cursor: pointer; text-align: left; padding: 6px 8px; border-radius: 4px; }
    .client-link:hover { background: #e3f0ff; }
    .requests-cell { max-height: 160px; overflow: auto; padding: 4px; }
    .requests-cell .req-line { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px dotted #eee; align-items: flex-start; }
    .requests-cell .req-line:last-child { border-bottom: none; }
    .requests-cell .req-days { flex-shrink: 0; font-size: 12px; color: #fff; background: #888; padding: 1px 6px; border-radius: 10px; white-space: nowrap; min-width: 110px; text-align: center; }
    .requests-cell .req-days.warn { background: #e6a817; color: #333; }
    .requests-cell .req-days.danger { background: #d9534f; }
    .requests-cell .req-days.ok { background: #5cb85c; }
    .requests-cell .req-date { flex-shrink: 0; font-size: 12px; color: #666; min-width: 80px; }
    .requests-cell .req-title { flex: 1; word-break: break-word; }
    .requests-cell .req-status { flex-shrink: 0; font-size: 12px; color: #555; background: #f0f0f0; padding: 1px 6px; border-radius: 10px; white-space: nowrap; }
    .requests-cell .req-type-request { flex-shrink: 0; font-size: 11px; color: #fff; background: #9b59b6; padding: 1px 6px; border-radius: 10px; white-space: nowrap; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); z-index: 999; overflow: auto; }
    .modal { background: #fff; max-width: 880px; margin: 30px auto; padding: 18px; border-radius: 10px; }
    .modal-large { max-width: 1100px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .modal-header h3 { margin: 0; }
    .close-btn { font-size: 28px; border: none; background: none; cursor: pointer; line-height: 1; }
    .modal label { display: block; margin-top: 10px; font-weight: bold; }
    .modal input, .modal textarea, .modal select { width: 100%; box-sizing: border-box; margin-top: 4px; }
    .modal-requests-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; padding-top: 12px; border-top: 1px solid #ddd; }
    .modal-requests-header label { margin: 0; font-size: 16px; }
    #clientRequests { margin-top: 10px; }
    .requests-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
    @media (max-width: 700px) { .requests-columns { grid-template-columns: 1fr; } }
    .requests-column { background: #fafafa; border: 2px dashed #ddd; border-radius: 8px; padding: 12px; min-height: 200px; }
    .requests-column h4 { margin: 0 0 10px 0; padding-bottom: 6px; border-bottom: 2px solid #ddd; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .requests-column.projects-col h4 { border-bottom-color: #5bc0de; }
    .requests-column.requests-col h4 { border-bottom-color: #9b59b6; }
    .tiles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .request-tile { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.2s; min-height: 80px; display: flex; flex-direction: column; justify-content: space-between; }
    .request-tile:hover { background: #f4f9ff; border-color: #004a99; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .request-tile.project-tile { border-left: 4px solid #5bc0de; }
    .request-tile.request-tile-type { border-left: 4px solid #9b59b6; background: #faf0ff; }
    .request-tile .tile-title { font-weight: bold; font-size: 14px; color: #004a99; margin-bottom: 6px; word-break: break-word; }
    .request-tile .tile-date { font-size: 12px; color: #666; }
    .request-tile .tile-status { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #f0f0f0; color: #555; margin-top: 6px; }
    .request-tile .tile-empty { color: #999; font-size: 13px; font-style: italic; }
    .days-badge { display: inline-block; font-size: 16px; font-weight: bold; color: #fff; background: #888; padding: 4px 12px; border-radius: 12px; margin-top: 4px; }
    .days-badge.ok { background: #5cb85c; }
    .days-badge.warn { background: #e6a817; color: #333; }
    .days-badge.danger { background: #d9534f; }
    .modal-actions { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
    .production-btn { background: #5bc0de; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .production-btn:hover { background: #31b0d5; }
    .archive-btn { background: #95a5a6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .archive-btn:hover { background: #7f8c8d; }
    .restore-btn { background: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .restore-btn:hover { background: #27ae60; }
    .delete-final-btn { background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .delete-final-btn:hover { background: #c9302c; }
    .convert-btn { background: #9b59b6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .convert-btn:hover { background: #8e44ad; }
    .import-btn { background: #5cb85c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .export-btn { background: #f0ad4e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .cloud-badge { background: #5cb85c; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .client-info-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
    @media (max-width: 700px) { .client-info-grid { grid-template-columns: 1fr; } }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 2px solid #ddd; }
    .tab { padding: 8px 16px; background: #f0f0f0; border: 1px solid #ddd; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 14px; font-weight: bold; color: #555; }
    .tab:hover { background: #e8e8e8; }
    .tab.active { background: white; color: #004a99; border-bottom: 2px solid white; margin-bottom: -2px; }
    .tab .count { background: #ddd; color: #333; padding: 1px 6px; border-radius: 10px; font-size: 11px; margin-left: 4px; }
    .tab.active .count { background: #004a99; color: white; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .nav-tab { padding: 10px 20px; background: white; border: 2px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; color: #555; transition: all 0.2s; }
    .nav-tab:hover { background: #f5f5f5; border-color: #999; }
    .nav-tab.active { background: #004a99; color: white; border-color: #004a99; }
    .view-modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #eee; }
    .view-modal-header h2 { margin: 0 0 4px 0; font-size: 22px; color: #004a99; }
    .view-type-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; }
    .view-type-badge.project { background: #5bc0de; }
    .view-type-badge.request { background: #9b59b6; }
    .view-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; padding: 12px; background: #f9f9f9; border-radius: 8px; }
    .view-info-item label { font-size: 11px; color: #777; text-transform: uppercase; margin-bottom: 2px; display: block; }
    .view-info-item .value { font-size: 14px; font-weight: bold; color: #222; }
    .view-comment-section { margin-top: 20px; border-top: 2px solid #eee; padding-top: 16px; }
    .view-comment-section h4 { margin: 0 0 12px 0; font-size: 16px; }
    .comment-add-form { display: flex; gap: 8px; margin-bottom: 16px; }
    .comment-add-form textarea { flex: 1; min-height: 60px; resize: vertical; }
    .comments-list { max-height: 400px; overflow-y: auto; }
    .comment-item { background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .comment-item .comment-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; color: #777; }
    .comment-item .comment-text { font-size: 14px; color: #222; white-space: pre-wrap; word-break: break-word; }
    .comment-item .comment-delete { background: none; border: none; color: #d9534f; cursor: pointer; font-size: 12px; padding: 2px 6px; }
    .view-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee; }
    .client-base-item { padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; background: white; cursor: pointer; transition: all 0.2s; }
    .client-base-item:hover { background: #f4f9ff; border-color: #b7d4ff; }
    .client-base-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .client-base-name { font-weight: bold; font-size: 15px; color: #004a99; }
    .client-base-info { font-size: 13px; color: #666; margin-bottom: 3px; }
    .client-base-stats { display: flex; gap: 12px; font-size: 12px; color: #555; margin-top: 6px; flex-wrap: wrap; }
    .client-base-stats span { background: #f0f0f0; padding: 2px 8px; border-radius: 10px; }
    .client-base-actions { display: flex; gap: 6px; }
    .contact-person-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
    .contact-person-row input { flex: 1; }
    .contact-person-row button { background: #d9534f; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .add-contact-btn { background: #5cb85c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 6px; }
    .add-contact-btn:hover { background: #449d44; }
    .sync-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #5cb85c; }
    .sync-indicator.syncing { color: #f0ad4e; }
    .sync-indicator.error { color: #d9534f; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .syncing .dot { animation: pulse 1s infinite; }
    .kanban-modal { max-width: 1200px; }
    .kanban-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
    @media (max-width: 900px) { .kanban-board { grid-template-columns: repeat(2, 1fr); } }
    .kanban-column { background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; padding: 10px; min-height: 300px; }
    .kanban-column h4 { margin: 0 0 10px 0; padding-bottom: 6px; border-bottom: 2px solid #ddd; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .kanban-column h4 .count { background: #ddd; color: #333; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .kanban-column.col-new h4 { border-bottom-color: #5bc0de; }
    .kanban-column.col-work h4 { border-bottom-color: #f0ad4e; }
    .kanban-column.col-check h4 { border-bottom-color: #9b59b6; }
    .kanban-column.col-done h4 { border-bottom-color: #5cb85c; }
    .task-card { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
    .task-card .task-title { font-weight: bold; margin-bottom: 4px; word-break: break-word; }
    .task-card .task-meta { font-size: 12px; color: #666; display: flex; flex-direction: column; gap: 2px; }
    .task-card .task-actions { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
    .task-card .task-actions button { font-size: 11px; padding: 2px 6px; }
    .add-task-form { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
    .add-task-form h4 { margin: 0 0 8px 0; font-size: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .assignee-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; background: #f9f9f9; border: 1px solid #eee; border-radius: 4px; margin-bottom: 4px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
    .stat-card { background: #f0f8ff; border: 1px solid #b7d4ff; border-radius: 6px; padding: 10px; }
    .stat-card .stat-value { font-size: 24px; font-weight: bold; color: #004a99; }
    .stat-card .stat-label { font-size: 12px; color: #666; }
    .load-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .load-bar-fill { height: 100%; background: #5cb85c; }
    .load-bar-fill.warn { background: #f0ad4e; }
    .load-bar-fill.danger { background: #d9534f; }
  </style>
</head>
<body>

  <h2>Учёт клиентов и проектов <span class="cloud-badge">☁ Облако</span> <span id="syncIndicator" class="sync-indicator"><span class="dot"></span><span>Подключение...</span></span></h2>

  <div class="nav-tabs">
    <button class="nav-tab active" id="navProjects" onclick="switchNavView('projects')"> Проекты</button>
    <button class="nav-tab" id="navRequests" onclick="switchNavView('requests')">📝 Заявки</button>
    <button class="nav-tab" id="navBase" onclick="switchNavView('base')"> База клиентов</button>
  </div>

  <div id="projectsView">
    <div class="tabs">
      <button class="tab active" id="tabActive" onclick="switchView('active')">📋 Активные <span class="count" id="activeCount">0</span></button>
      <button class="tab" id="tabArchive" onclick="switchView('archive')">📦 Архив <span class="count" id="archiveCount">0</span></button>
    </div>
    <div class="toolbar">
      <input id="search" placeholder="Поиск..." style="width: 280px" oninput="render()">
      <select id="statusFilter" onchange="render()">
        <option value="">Все статусы</option><option>Новая</option><option>В работе</option><option>Выполнена</option><option>Отменена</option>
      </select>
      <button onclick="addClient()">+ Добавить проект</button>
      <button class="export-btn" onclick="exportCSV()">📤 Экспорт</button>
      <button class="import-btn" onclick="document.getElementById('importFile').click()">📥 Импорт</button>
      <input type="file" id="importFile" accept=".csv" style="display:none;" onchange="importCSV(event)">
      <span id="info" class="muted"></span>
    </div>
    <table><thead><tr><th style="width:200px;">Клиент</th><th>Проекты</th><th style="width:110px;">Действия</th></tr></thead><tbody id="tbody"></tbody></table>
  </div>

  <div id="requestsView" style="display:none;">
    <div class="tabs">
      <button class="tab active" id="tabRequestActive" onclick="switchRequestView('active')">📋 Активные <span class="count" id="requestActiveCount">0</span></button>
      <button class="tab" id="tabRequestArchive" onclick="switchRequestView('archive')">📦 Архив <span class="count" id="requestArchiveCount">0</span></button>
    </div>
    <div class="toolbar">
      <input id="requestSearch" placeholder="Поиск..." style="width: 280px" oninput="renderRequests()">
      <button onclick="addRequest()">+ Добавить заявку</button>
      <button class="export-btn" onclick="exportRequestsCSV()">📤 Экспорт</button>
      <span id="requestInfo" class="muted"></span>
    </div>
    <table><thead><tr><th style="width:200px;">Клиент</th><th>Заявки</th><th style="width:110px;">Действия</th></tr></thead><tbody id="requestsTbody"></tbody></table>
  </div>

  <div id="baseView" style="display:none;">
    <div class="toolbar">
      <input id="baseSearch" placeholder="🔍 Поиск по названию клиента..." style="width: 360px" oninput="renderBase()">
      <span id="baseInfo" class="muted"></span>
    </div>
    <div id="baseList"></div>
  </div>

  <div id="clientModal" class="modal-overlay" onclick="if (event.target === this) closeClientModal()">
    <div class="modal modal-large">
      <div class="modal-header"><h3>Карточка клиента</h3><button class="close-btn" onclick="closeClientModal()">×</button></div>
      <label for="clientName">Имя клиента / Название компании</label><input id="clientName">
      
      <label style="margin-top:14px;">Телефоны</label>
      <div class="client-info-grid">
        <div><label for="clientPhone1">Телефон 1</label><input id="clientPhone1" placeholder="+7 900 000-00-00"></div>
        <div><label for="clientPhone2">Телефон 2</label><input id="clientPhone2" placeholder="+7 900 000-00-00"></div>
        <div><label for="clientPhone3">Телефон 3</label><input id="clientPhone3" placeholder="+7 900 000-00-00"></div>
      </div>

      <div class="client-info-grid" style="grid-template-columns:1fr 1fr;">
        <div><label for="clientEmail">Email</label><input id="clientEmail" placeholder="email@example.com"></div>
        <div><label for="clientWebsite">Сайт</label><input id="clientWebsite" placeholder="https://example.com"></div>
      </div>

      <div style="margin-top:10px;"><label for="clientAddress">Адрес</label><input id="clientAddress" placeholder="Город, улица, дом, офис"></div>

      <div style="margin-top:14px;">
        <label>Контактные лица</label>
        <div id="contactPersonsList"></div>
        <button class="add-contact-btn" onclick="addContactPerson()">+ Добавить контактное лицо</button>
      </div>

      <div class="requests-columns">
        <div class="requests-column projects-col">
          <h4> Проекты <button onclick="addRequestToClient('project')" style="font-size:12px;">+ Проект</button></h4>
          <div class="tiles-grid" id="projectsTiles"></div>
        </div>
        <div class="requests-column requests-col">
          <h4>📝 Заявки <button onclick="addRequestToClient('request')" style="font-size:12px;">+ Заявку</button></h4>
          <div class="tiles-grid" id="requestsTiles"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button onclick="saveClientModal()">Сохранить и закрыть</button>
        <button onclick="closeClientModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <div id="viewModal" class="modal-overlay" onclick="if (event.target === this) closeViewModal()">
    <div class="modal modal-large">
      <div class="view-modal-header">
        <div>
          <h2 id="viewTitle">Название</h2>
          <span id="viewTypeBadge" class="view-type-badge">ТИП</span>
          <div style="margin-top:4px;font-size:13px;color:#666;">Клиент: <strong id="viewClientName"></strong></div>
        </div>
        <button class="close-btn" onclick="closeViewModal()">×</button>
      </div>
      <div class="view-info-grid">
        <div class="view-info-item"><label>Дата начала</label><div class="value" id="viewDate">—</div></div>
        <div class="view-info-item" id="viewEndDateBlock"><label>Дата окончания</label><div class="value" id="viewEndDate">—</div></div>
        <div class="view-info-item"><label>Статус</label><div class="value"><select id="viewStatus" onchange="updateViewField('status', this.value)"><option>Новая</option><option>В работе</option><option>Выполнена</option><option>Отменена</option></select></div></div>
        <div class="view-info-item"><label>Ответственный</label><div class="value"><input id="viewResponsible" placeholder="Кто выполняет" onchange="updateViewField('responsible', this.value)"></div></div>
        <div class="view-info-item" id="viewDaysBlock" style="grid-column:1/-1;"><label>Дней в работе</label><div class="value"><span id="viewDaysBadge" class="days-badge">—</span></div></div>
      </div>
      <div style="margin-top:16px;"><label style="font-weight:bold;">Описание</label><textarea id="viewComment" rows="4" placeholder="Основное описание" onchange="updateViewField('comment', this.value)"></textarea></div>
      <div class="view-comment-section">
        <h4>💬 Комментарии и заметки</h4>
        <div class="comment-add-form"><textarea id="newCommentText" placeholder="Напишите комментарий..."></textarea><button class="production-btn" onclick="addComment()">Добавить</button></div>
        <div class="comments-list" id="commentsList"></div>
      </div>
      <div class="view-actions" id="viewActions"></div>
    </div>
  </div>

  <div id="productionModal" class="modal-overlay" onclick="if (event.target === this) closeProduction()">
    <div class="modal kanban-modal">
      <div class="modal-header"><h3>🏭 Производство: <span id="productionRequestTitle"></span></h3><button class="close-btn" onclick="closeProduction()">×</button></div>
      <div class="kanban-toolbar">
        <button onclick="openAssigneesModal()"> Исполнители</button>
        <button onclick="openStatsModal()">📊 Статистика</button>
      </div>
      <div class="add-task-form">
        <h4>➕ Новое задание</h4>
        <div class="form-row">
          <div><label>Название</label><input id="newTaskTitle" placeholder="Название задания"></div>
          <div><label>Исполнитель</label><select id="newTaskAssignee"></select></div>
        </div>
        <div class="form-row">
          <div><label>Срок</label><input id="newTaskDeadline" type="date"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBr7FYUUm3HXb8vWypUiDS_gIYS8wlYpOU",
  authDomain: "ultra-rezonans.firebaseapp.com",
  databaseURL: "https://ultra-rezonans-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ultra-rezonans",
  storageBucket: "ultra-rezonans.firebasestorage.app",
  messagingSenderId: "414666000829",
  appId: "1:414666000829:web:2b32d89f8dd4bb6471aad4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let rows = [];
let leads = [];
let clients = {};
let assignees = [];
let tasks = {};
let currentClientOldName = '';
let currentProductionRequest = null;
let currentView = 'active';
let currentRequestView = 'active';
let currentNavView = 'projects';
let currentViewRequest = null;
let currentViewType = null;
let tempContactPersons = [];
let unsubscribeClients = null, unsubscribeRequests = null, unsubscribeLeads = null, unsubscribeAssignees = null, unsubscribeTasks = null;

function setSyncStatus(status, message) {
  const indicator = document.getElementById('syncIndicator');
  indicator.className = 'sync-indicator ' + status;
  indicator.querySelector('span:last-child').textContent = message;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function today() { return new Date().toISOString().slice(0, 10); }
function nowDateTime() { const n = new Date(); return { date: n.toLocaleDateString('ru-RU'), time: n.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) }; }

function parseDate(s) { if (!s) return null; const p = String(s).split('-'); if (p.length !== 3) return null; return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); }
function daysBetween(a, b) { const x = parseDate(a), y = parseDate(b); if (!x || !y) return 0; return Math.floor((y.getTime()-x.getTime())/(1000*60*60*24)); }
function daysFromStart(d) { return daysBetween(d, today()); }
function daysUntilEnd(d) { if (!d) return null; return daysBetween(today(), d); }

function getDeadlineBadge(end, start) {
  if (!end) { const d = daysFromStart(start); return { cls: '', text: daysLabel(Math.max(0,d)) + ' в работе' }; }
  const left = daysUntilEnd(end);
  if (left < 0) return { cls: 'danger', text: 'просрочен на ' + daysLabel(Math.abs(left)) };
  if (left === 0) return { cls: 'warn', text: 'срок сегодня' };
  if (left <= 30) return { cls: 'warn', text: 'до конца ' + daysLabel(left) };
  return { cls: 'ok', text: 'до конца ' + daysLabel(left) };
}

function daysLabel(d) {
  if (d === 0) return 'сегодня';
  if (d === 1) return '1 день';
  const lt = d % 100, lo = d % 10;
  if (lt >= 11 && lt <= 14) return d + ' дней';
  if (lo === 1) return d + ' день';
  if (lo >= 2 && lo <= 4) return d + ' дня';
  return d + ' дней';
}

function getClientName(r) { return String(r.client || '').trim(); }
function getRequestTitle(r) { return String(r.title || r.request || '').trim(); }

function generateNewClientName() {
  let base = 'Новый клиент', name = base, n = 1;
  while (rows.some(r => getClientName(r) === name) || leads.some(l => getClientName(l) === name) || clients[name]) { n++; name = base + ' ' + n; }
  return name;
}

async function saveClientToFirebase(name, data) {
  try { await setDoc(doc(db, 'clients', name), data); setSyncStatus('synced', 'Синхронизировано'); }
  catch (e) { console.error(e); setSyncStatus('error', 'Ошибка'); }
}

async function saveRequestToFirebase(id, data, col = 'requests') {
  try { await setDoc(doc(db, col, id), data); setSyncStatus('synced', 'Синхронизировано'); }
  catch (e) { console.error(e); setSyncStatus('error', 'Ошибка'); }
}

async function deleteRequestFromFirebase(id, col = 'requests') {
  try {
    await deleteDoc(doc(db, col, id));
    if (col === 'requests') await deleteDoc(doc(db, 'tasks', id));
  } catch (e) { console.error(e); }
}

async function saveAssigneesToFirebase() {
  try { await setDoc(doc(db, 'settings', 'assignees'), { list: assignees }); } catch (e) { console.error(e); }
}

async function saveTasksToFirebase(id, list) {
  try { await setDoc(doc(db, 'tasks', id), { tasks: list }); } catch (e) { console.error(e); }
}

async function ensureClientExists(name) {
  if (!clients[name]) {
    clients[name] = { name, phones: ['', '', ''], contactPersons: [], address: '', email: '', website: '', createdAt: today() };
    await saveClientToFirebase(name, clients[name]);
  }
  return clients[name];
}

function setupRealtimeListeners() {
  setSyncStatus('syncing', 'Подключение...');
  unsubscribeClients = onSnapshot(collection(db, 'clients'), snap => {
    clients = {};
    snap.forEach(d => { clients[d.id] = d.data(); });
    render(); renderRequests(); renderBase();
    if (currentClientOldName) renderClientRequests(currentClientOldName);
    setSyncStatus('synced', 'Синхронизировано');
  }, e => { console.error(e); setSyncStatus('error', 'Ошибка'); });

  unsubscribeRequests = onSnapshot(collection(db, 'requests'), snap => {
    rows = [];
    snap.forEach(d => { rows.push({ id: d.id, ...d.data() }); });
    render();
    if (currentClientOldName) renderClientRequests(currentClientOldName);
    if (currentViewRequest && currentViewType === 'project') refreshViewModal();
    setSyncStatus('synced', 'Синхронизировано');
  }, e => { console.error(e); setSyncStatus('error', 'Ошибка'); });

  unsubscribeLeads = onSnapshot(collection(db, 'leads'), snap => {
    leads = [];
    snap.forEach(d => { leads.push({ id: d.id, ...d.data() }); });
    renderRequests();
    if (currentClientOldName) renderClientRequests(currentClientOldName);
    if (currentViewRequest && currentViewType === 'request') refreshViewModal();
    setSyncStatus('synced', 'Синхронизировано');
  }, e => { console.error(e); setSyncStatus('error', 'Ошибка'); });

  unsubscribeAssignees = onSnapshot(doc(db, 'settings', 'assignees'), d => {
    assignees = d.exists() ? (d.data().list || []) : [];
  });

  unsubscribeTasks = onSnapshot(collection(db, 'tasks'), snap => {
    tasks = {};
    snap.forEach(d => { tasks[d.id] = d.data().tasks || []; });
    if (currentProductionRequest) renderProduction();
    if (currentClientOldName) renderClientRequests(currentClientOldName);
  });
}

async function addClient() {
  const name = generateNewClientName();
  await saveClientToFirebase(name, { name, phones: ['', '', ''], contactPersons: [], address: '', email: '', website: '', createdAt: today() });
  setTimeout(() => openClientModalByName(name), 300);
}

async function addRequest() {
  const name = generateNewClientName();
  await ensureClientExists(name);
  setTimeout(() => openClientModalByName(name), 300);
}

function getClientList() {
  const names = new Set();
  Object.keys(clients).forEach(n => { if (n.trim()) names.add(n); });
  rows.forEach(r => { const n = getClientName(r); if (n) names.add(n); });
  return Array.from(names).map(name => {
    const cr = rows.filter(r => getClientName(r) === name);
    const requests = cr.map(r => ({ id: r.id, date: String(r.date||'').trim(), endDate: String(r.endDate||'').trim(), title: getRequestTitle(r), status: String(r.status||'').trim(), archived: !!r.archived, days: daysFromStart(String(r.date||'').trim()) })).sort((a,b) => b.date.localeCompare(a.date));
    return { name, requests, requestCount: cr.length };
  });
}

function getRequestList() {
  const names = new Set();
  Object.keys(clients).forEach(n => { if (n.trim()) names.add(n); });
  leads.forEach(l => { const n = getClientName(l); if (n) names.add(n); });
  return Array.from(names).map(name => {
    const cl = leads.filter(l => getClientName(l) === name);
    const list = cl.map(l => ({ id: l.id, date: String(l.date||'').trim(), title: getRequestTitle(l), status: String(l.status||'').trim(), archived: !!l.archived })).sort((a,b) => b.date.localeCompare(a.date));
    return { name, requests: list, requestCount: cl.length };
  });
}

function getBaseList() {
  return Object.keys(clients).map(name => {
    const c = clients[name];
    const phones = c.phones || (c.phone ? [c.phone] : []);
    const contactPersons = c.contactPersons || (c.contactPerson ? [{ name: c.contactPerson, position: '' }] : []);
    return { 
      name, 
      phones,
      contactPersons,
      address: c.address||'', 
      email: c.email||'', 
      website: c.website||'', 
      createdAt: c.createdAt||'', 
      projectCount: rows.filter(r => getClientName(r) === name && !r.archived).length, 
      requestCount: leads.filter(l => getClientName(l) === name && !l.archived).length 
    };
  }).sort((a,b) => a.name.localeCompare(b.name, 'ru'));
}

async function deleteClientFromBase(name) {
  if (!confirm('Удалить клиента "' + name + '" и все его проекты и заявки БЕЗВОЗВРАТНО?')) return;
  delete clients[name];
  await deleteDoc(doc(db, 'clients', name));
  for (const r of rows.filter(r => getClientName(r) === name)) await deleteRequestFromFirebase(r.id, 'requests');
  for (const l of leads.filter(l => getClientName(l) === name)) await deleteRequestFromFirebase(l.id, 'leads');
  rows = rows.filter(r => getClientName(r) !== name);
  leads = leads.filter(l => getClientName(l) !== name);
  render(); renderRequests(); renderBase();
}

function openClientModalByName(name) {
  if (!name) return;
  ensureClientExists(name);
  currentClientOldName = name;
  const s = clients[name] || {};
  document.getElementById('clientName').value = s.name || name;
  
  // Телефоны (с обратной совместимостью)
  const phones = s.phones || (s.phone ? [s.phone] : ['', '', '']);
  document.getElementById('clientPhone1').value = phones[0] || '';
  document.getElementById('clientPhone2').value = phones[1] || '';
  document.getElementById('clientPhone3').value = phones[2] || '';
  
  document.getElementById('clientAddress').value = s.address || '';
  document.getElementById('clientEmail').value = s.email || '';
  document.getElementById('clientWebsite').value = s.website || '';
  
  // Контактные лица (с обратной совместимостью)
  tempContactPersons = s.contactPersons 
    ? s.contactPersons.map(cp => ({ name: cp.name || '', position: cp.position || '' }))
    : (s.contactPerson ? [{ name: s.contactPerson, position: '' }] : []);
  renderContactPersons();
  
  renderClientRequests(name);
  document.getElementById('clientModal').style.display = 'block';
}

function closeClientModal() { document.getElementById('clientModal').style.display = 'none'; currentClientOldName = ''; }

// === Контактные лица ===
function renderContactPersons() {
  const container = document.getElementById('contactPersonsList');
  if (!tempContactPersons.length) {
    container.innerHTML = '<div class="muted">Контактных лиц пока нет. Нажмите кнопку ниже, чтобы добавить.</div>';
    return;
  }
  container.innerHTML = tempContactPersons.map((cp, i) => `
    <div class="contact-person-row">
      <input placeholder="Имя" value="${escapeHtml(cp.name || '')}" onchange="updateContactPerson(${i}, 'name', this.value)">
      <input placeholder="Должность" value="${escapeHtml(cp.position || '')}" onchange="updateContactPerson(${i}, 'position', this.value)">
      <button onclick="removeContactPerson(${i})">✖</button>
    </div>
  `).join('');
}

function addContactPerson() {
  tempContactPersons.push({ name: '', position: '' });
  renderContactPersons();
}

function removeContactPerson(i) {
  tempContactPersons.splice(i, 1);
  renderContactPersons();
}

function updateContactPerson(i, field, value) {
  if (tempContactPersons[i]) tempContactPersons[i][field] = value;
}

async function applyClientForm() {
  const newName = document.getElementById('clientName').value.trim() || 'Без имени';
  const phones = [
    document.getElementById('clientPhone1').value.trim(),
    document.getElementById('clientPhone2').value.trim(),
    document.getElementById('clientPhone3').value.trim()
  ];
  const address = document.getElementById('clientAddress').value.trim();
  const email = document.getElementById('clientEmail').value.trim();
  const website = document.getElementById('clientWebsite').value.trim();
  const oldName = currentClientOldName;
  let createdAt = today();
  if (oldName && clients[oldName] && clients[oldName].createdAt) createdAt = clients[oldName].createdAt;
  if (clients[newName] && clients[newName].createdAt) createdAt = clients[newName].createdAt;

  if (oldName && oldName !== newName) {
    rows.forEach(r => { if (getClientName(r) === oldName) { r.client = newName; saveRequestToFirebase(r.id, r, 'requests'); } });
    leads.forEach(l => { if (getClientName(l) === oldName) { l.client = newName; saveRequestToFirebase(l.id, l, 'leads'); } });
    if (clients[oldName]) { delete clients[oldName]; await deleteDoc(doc(db, 'clients', oldName)); }
  }
  clients[newName] = { 
    name: newName, 
    phones,
    contactPersons: tempContactPersons.map(cp => ({ name: cp.name || '', position: cp.position || '' })),
    address, email, website, createdAt 
  };
  await saveClientToFirebase(newName, clients[newName]);
  currentClientOldName = newName;
  return newName;
}

async function saveClientModal() { await applyClientForm(); closeClientModal(); }

async function addRequestToClient(type) {
  const clientName = await applyClientForm();
  const phone = document.getElementById('clientPhone1').value.trim();
  const isReq = type === 'request';
  const newItem = { id: uid(), date: today(), endDate: '', client: clientName, contact: phone, title: '', request: '', comment: '', comments: [], priority: 'Средний', status: 'Новая', responsible: '', archived: false };
  await saveRequestToFirebase(newItem.id, newItem, isReq ? 'leads' : 'requests');
}

async function updateRequest(id, field, value) {
  const isReq = leads.some(l => l.id === id);
  const col = isReq ? 'leads' : 'requests';
  const list = isReq ? leads : rows;
  const item = list.find(r => r.id === id);
  if (!item) return;
  item[field] = value;
  await saveRequestToFirebase(id, item, col);
}

async function archiveProject(id) {
  if (!confirm('Отправить проект в архив?')) return;
  const item = rows.find(r => r.id === id);
  if (!item) return;
  item.archived = true;
  await saveRequestToFirebase(id, item, 'requests');
}

async function archiveRequest(id) {
  if (!confirm('Отправить заявку в архив?')) return;
  const item = leads.find(l => l.id === id);
  if (!item) return;
  item.archived = true;
  await saveRequestToFirebase(id, item, 'leads');
}

async function restoreProject(id) {
  const item = rows.find(r => r.id === id);
  if (!item) return;
  item.archived = false;
  await saveRequestToFirebase(id, item, 'requests');
}

async function restoreRequest(id) {
  const item = leads.find(l => l.id === id);
  if (!item) return;
  item.archived = false;
  await saveRequestToFirebase(id, item, 'leads');
}

async function deleteProjectFinal(id) {
  if (!confirm('Удалить проект БЕЗВОЗВРАТНО?')) return;
  await deleteRequestFromFirebase(id, 'requests');
  rows = rows.filter(r => r.id !== id);
  delete tasks[id];
  render();
}

async function deleteRequestFinal(id) {
  if (!confirm('Удалить заявку БЕЗВОЗВРАТНО?')) return;
  await deleteRequestFromFirebase(id, 'leads');
  leads = leads.filter(l => l.id !== id);
  renderRequests();
}

async function convertRequestToProject(id) {
  if (!confirm('Конвертировать заявку в проект?')) return;
  const req = leads.find(l => l.id === id);
  if (!req) return;
  const newProj = { ...req, id: uid(), archived: false };
  await saveRequestToFirebase(newProj.id, newProj, 'requests');
  await deleteRequestFromFirebase(id, 'leads');
  setTimeout(() => alert('✅ Заявка конвертирована в проект!'), 300);
}

async function convertProjectToRequest(id) {
  if (!confirm('Конвертировать проект в заявку?')) return;
  const proj = rows.find(r => r.id === id);
  if (!proj) return;
  const newReq = { ...proj, id: uid(), archived: false };
  await saveRequestToFirebase(newReq.id, newReq, 'leads');
  await deleteRequestFromFirebase(id, 'requests');
  setTimeout(() => alert('✅ Проект конвертирован в заявку!'), 300);
}

function openRequestView(id, type) {
  const list = type === 'project' ? rows : leads;
  const item = list.find(r => r.id === id);
  if (!item) return;
  currentViewRequest = item;
  currentViewType = type;
  document.getElementById('viewTitle').textContent = getRequestTitle(item) || '(без названия)';
  document.getElementById('viewClientName').textContent = getClientName(item);
  const badge = document.getElementById('viewTypeBadge');
  badge.textContent = type === 'project' ? 'ПРОЕКТ' : 'ЗАЯВКА';
  badge.className = 'view-type-badge ' + type;
  document.getElementById('viewDate').textContent = item.date || '—';
  document.getElementById('viewEndDate').textContent = item.endDate || 'не указана';
  document.getElementById('viewEndDateBlock').style.display = type === 'project' ? 'block' : 'none';
  document.getElementById('viewDaysBlock').style.display = type === 'project' ? 'block' : 'none';
  if (type === 'project') {
    const b = getDeadlineBadge(item.endDate, item.date);
    const db = document.getElementById('viewDaysBadge');
    db.textContent = b.text; db.className = 'days-badge ' + b.cls;
  }
  document.getElementById('viewStatus').value = item.status || 'Новая';
  document.getElementById('viewResponsible').value = item.responsible || '';
  document.getElementById('viewComment').value = item.comment || '';
  renderViewActions();
  renderComments();
  document.getElementById('viewModal').style.display = 'block';
}

function closeViewModal() { document.getElementById('viewModal').style.display = 'none'; currentViewRequest = null; currentViewType = null; }

function refreshViewModal() {
  if (!currentViewRequest || !currentViewType) return;
  const list = currentViewType === 'project' ? rows : leads;
  const u = list.find(r => r.id === currentViewRequest.id);
  if (!u) return;
  currentViewRequest = u;
  document.getElementById('viewTitle').textContent = getRequestTitle(u) || '(без названия)';
  document.getElementById('viewDate').textContent = u.date || '—';
  document.getElementById('viewEndDate').textContent = u.endDate || 'не указана';
  document.getElementById('viewStatus').value = u.status || 'Новая';
  document.getElementById('viewResponsible').value = u.responsible || '';
  document.getElementById('viewComment').value = u.comment || '';
  if (currentViewType === 'project') {
    const b = getDeadlineBadge(u.endDate, u.date);
    const db = document.getElementById('viewDaysBadge');
    db.textContent = b.text; db.className = 'days-badge ' + b.cls;
  }
  renderComments();
}

async function updateViewField(field, value) {
  if (!currentViewRequest || !currentViewType) return;
  const col = currentViewType === 'project' ? 'requests' : 'leads';
  const list = currentViewType === 'project' ? rows : leads;
  const item = list.find(r => r.id === currentViewRequest.id);
  if (!item) return;
  item[field] = value;
  currentViewRequest[field] = value;
  await saveRequestToFirebase(item.id, item, col);
}

async function addComment() {
  if (!currentViewRequest || !currentViewType) return;
  const text = document.getElementById('newCommentText').value.trim();
  if (!text) { alert('Введите текст комментария'); return; }
  const col = currentViewType === 'project' ? 'requests' : 'leads';
  const list = currentViewType === 'project' ? rows : leads;
  const item = list.find(r => r.id === currentViewRequest.id);
  if (!item) return;
  if (!Array.isArray(item.comments)) item.comments = [];
  const dt = nowDateTime();
  item.comments.push({ id: uid(), text, date: dt.date, time: dt.time });
  currentViewRequest = item;
  await saveRequestToFirebase(item.id, item, col);
  document.getElementById('newCommentText').value = '';
  renderComments();
}

async function deleteComment(cid) {
  if (!confirm('Удалить комментарий?')) return;
  if (!currentViewRequest || !currentViewType) return;
  const col = currentViewType === 'project' ? 'requests' : 'leads';
  const list = currentViewType === 'project' ? rows : leads;
  const item = list.find(r => r.id === currentViewRequest.id);
  if (!item) return;
  item.comments = (item.comments || []).filter(c => c.id !== cid);
  currentViewRequest = item;
  await saveRequestToFirebase(item.id, item, col);
  renderComments();
}

function renderComments() {
  const list = document.getElementById('commentsList');
  const comments = (currentViewRequest && currentViewRequest.comments) || [];
  if (!comments.length) { list.innerHTML = '<div class="muted">Комментариев пока нет.</div>'; return; }
  list.innerHTML = [...comments].reverse().map(c => '<div class="comment-item"><div class="comment-meta"><span>📅 ' + escapeHtml(c.date) + ' в ' + escapeHtml(c.time) + '</span><button class="comment-delete" onclick="deleteComment(\'' + c.id + '\')">Удалить</button></div><div class="comment-text">' + escapeHtml(c.text) + '</div></div>').join('');
}

function renderViewActions() {
  const div = document.getElementById('viewActions');
  div.innerHTML = '';
  if (!currentViewRequest || !currentViewType) return;
  const itemId = currentViewRequest.id;
  const itemType = currentViewType;

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let current = []; let field = ''; let inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], nx = text[i+1];
    if (inQ) { if (ch === '"' && nx === '"') { field += '"'; i++; } else if (ch === '"') inQ = false; else field += ch; }
    else { if (ch === '"') inQ = true; else if (ch === ';') { current.push(field); field = ''; } else if (ch === '\r') {} else if (ch === '\n') { current.push(field); field = ''; if (current.length > 1 || current[0] !== '') rows.push(current); current = []; } else field += ch; }
  }
  current.push(field);
  if (current.length > 1 || current[0] !== '') rows.push(current);
  return rows;
}

async function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const parsed = parseCSV(e.target.result);
      if (parsed.length < 2) { alert('Файл пустой.'); return; }
      let ca = 0, pa = 0;
      for (let i = 1; i < parsed.length; i++) {
        const line = parsed[i];
        if (!line || line.length < 7) continue;
        const cn = String(line[0]||'').trim(), ph1 = String(line[1]||'').trim(), ph2 = String(line[2]||'').trim(), ph3 = String(line[3]||'').trim(), cpsStr = String(line[4]||'').trim(), em = String(line[5]||'').trim(), ws = String(line[6]||'').trim(), ad = String(line[7]||'').trim(), dt = String(line[9]||'').trim(), ed = String(line[10]||'').trim(), ti = String(line[11]||'').trim(), st = String(line[12]||'').trim(), ar = String(line[13]||'').trim().toLowerCase() === 'да';
        const phones = [ph1, ph2, ph3].filter(p => p);
        const contactPersons = cpsStr ? cpsStr.split(';').map(s => { const m = s.trim().match(/^(.+?)(?:\s*\((.+)\))?$/); return m ? { name: m[1].trim(), position: (m[2]||'').trim() } : { name: s.trim(), position: '' }; }).filter(cp => cp.name) : [];
        if (cn) {
          if (!clients[cn]) { clients[cn] = { name: cn, phones: [ph1||'', ph2||'', ph3||''], contactPersons, address: ad, email: em, website: ws, createdAt: dt || today() }; await saveClientToFirebase(cn, clients[cn]); ca++; }
        }
        if (ti || dt || ed) {
          const np = { id: uid(), date: dt || today(), endDate: ed || '', client: cn, contact: ph1, title: ti, request: '', comment: '', comments: [], priority: 'Средний', status: st || 'Новая', responsible: '', archived: ar };
          await saveRequestToFirebase(np.id, np, 'requests');
          rows.push(np); pa++;
        }
      }
      render();
      alert('Импорт завершён!\nКлиентов: ' + ca + '\nПроектов: ' + pa);
    } catch (err) { alert('Ошибка: ' + err.message); }
    event.target.value = '';
  };
  reader.onerror = () => { alert('Не удалось прочитать файл.'); event.target.value = ''; };
  reader.readAsText(file, 'UTF-8');
}

function renderTaskCard(t) {
  const dl = t.deadline || '';
  const left = daysUntilEnd(dl);
  let dt = '', dc = '';
  if (dl) {
    if (left === null) dt = '';
    else if (left < 0) { dt = 'Просрочено на ' + Math.abs(left) + ' дн.'; dc = 'overdue'; }
    else if (left === 0) { dt = 'Срок сегодня'; dc = 'soon'; }
    else if (left <= 3) { dt = 'Осталось ' + left + ' дн.'; dc = 'soon'; }
    else dt = 'Срок: ' + dl;
  }
  const so = ['new','work','check','done'], ci = so.indexOf(t.status);
  return '<div class="task-card"><div class="task-title">' + escapeHtml(t.title || '(без названия)') + '</div><div class="task-meta"><div>👤 ' + escapeHtml(t.assignee || 'не назначен') + '</div>' + (dt ? '<div class="' + dc + '">📅 ' + escapeHtml(dt) + '</div>' : '') + (t.comment ? '<div>💬 ' + escapeHtml(t.comment) + '</div>' : '') + '</div><div class="task-actions">' + (ci > 0 ? '<button onclick="moveTask(\'' + t.id + '\', -1)">← Назад</button>' : '') + (ci < so.length-1 ? '<button onclick="moveTask(\'' + t.id + '\', 1)">Далее →</button>' : '') + '<button onclick="editTask(\'' + t.id + '\')">✏️</button><button onclick="deleteTask(\'' + t.id + '\')">🗑️</button></div></div>';
}

async function addTask() {
  const id = currentProductionRequest;
  if (!id) return;
  const ti = document.getElementById('newTaskTitle').value.trim();
  const as = document.getElementById('newTaskAssignee').value;
  const dl = document.getElementById('newTaskDeadline').value;
  const co = document.getElementById('newTaskComment').value.trim();
  if (!ti) { alert('Введите название'); return; }
  if (!as) { alert('Выберите исполнителя'); return; }
  const rt = getRequestTasks(id);
  rt.push({ id: uid(), title: ti, assignee: as, deadline: dl, comment: co, status: 'new', createdAt: today() });
  await saveTasksToFirebase(id, rt);
  tasks[id] = rt;
  renderProduction();
}

async function moveTask(tid, dir) {
  const id = currentProductionRequest;
  if (!id) return;
  const rt = getRequestTasks(id);
  const t = rt.find(x => x.id === tid);
  if (!t) return;
  const so = ['new','work','check','done'], ci = so.indexOf(t.status), ni = ci + dir;
  if (ni < 0 || ni >= so.length) return;
  t.status = so[ni];
  await saveTasksToFirebase(id, rt);
  renderProduction();
}

async function editTask(tid) {
  const id = currentProductionRequest;
  if (!id) return;
  const rt = getRequestTasks(id);
  const t = rt.find(x => x.id === tid);
  if (!t) return;
  const nt = prompt('Название:', t.title); if (nt === null) return;
  const na = prompt('Исполнитель:', t.assignee); if (na === null) return;
  const nd = prompt('Срок (ГГГГ-ММ-ДД):', t.deadline || ''); if (nd === null) return;
  const nc = prompt('Комментарий:', t.comment || ''); if (nc === null) return;
  t.title = nt.trim(); t.assignee = na.trim(); t.deadline = nd.trim(); t.comment = nc.trim();
  await saveTasksToFirebase(id, rt);
  renderProduction();
}

async function deleteTask(tid) {
  if (!confirm('Удалить задание?')) return;
  const id = currentProductionRequest;
  if (!id) return;
  tasks[id] = getRequestTasks(id).filter(t => t.id !== tid);
  await saveTasksToFirebase(id, tasks[id]);
  renderProduction();
}

async function openAssigneesModal() { document.getElementById('assigneesModal').style.display = 'block'; renderAssignees(); }
function closeAssigneesModal() { document.getElementById('assigneesModal').style.display = 'none'; }

function renderAssignees() {
  const list = document.getElementById('assigneeList');
  if (!assignees.length) { list.innerHTML = '<div class="muted">Исполнителей пока нет.</div>'; return; }
  list.innerHTML = assignees.map(n => { const l = getAssigneeLoad(n); return '<div class="assignee-item"><span> ' + escapeHtml(n) + '</span><span><span class="muted">Заданий: ' + l.active + ' (в работе), всего: ' + l.total + '</span><button onclick="removeAssignee(\'' + escapeHtml(n) + '\')" style="margin-left:8px;">✖</button></span></div>'; }).join('');
}

async function addAssignee() {
  const input = document.getElementById('newAssigneeName');
  const n = input.value.trim();
  if (!n) return;
  if (assignees.includes(n)) { alert('Такой уже есть'); return; }
  assignees.push(n);
  await saveAssigneesToFirebase();
  input.value = '';
  renderAssignees();
}

async function removeAssignee(n) {
  if (!confirm('Удалить исполнителя "' + n + '"?')) return;
  assignees = assignees.filter(a => a !== n);
  await saveAssigneesToFirebase();
  renderAssignees();
}

function getAssigneeLoad(n) { let t = 0, a = 0; Object.values(tasks).forEach(rt => rt.forEach(x => { if (x.assignee === n) { t++; if (x.status !== 'done') a++; } })); return { total: t, active: a }; }

function openStatsModal() { document.getElementById('statsModal').style.display = 'block'; renderStats(); }
function closeStatsModal() { document.getElementById('statsModal').style.display = 'none'; }

function renderStats() {
  const id = currentProductionRequest;
  if (!id) return;
  const rt = getRequestTasks(id);
  const total = rt.length, done = rt.filter(t => t.status === 'done').length, active = rt.filter(t => t.status !== 'done').length, overdue = rt.filter(t => { if (t.status === 'done') return false; const d = daysUntilEnd(t.deadline); return d !== null && d < 0; }).length;
  let html = '<div class="stats-grid"><div class="stat-card"><div class="stat-value">' + total + '</div><div class="stat-label">Всего заданий</div></div><div class="stat-card"><div class="stat-value">' + active + '</div><div class="stat-label">В работе</div></div><div class="stat-card"><div class="stat-value">' + done + '</div><div class="stat-label">Выполнено</div></div><div class="stat-card"><div class="stat-value" style="color:#d9534f;">' + overdue + '</div><div class="stat-label">Просрочено</div></div></div><h4 style="margin-top:20px;">Загрузка исполнителей</h4>';
  if (!assignees.length) html += '<div class="muted">Исполнителей пока нет.</div>';
  else {
    const max = Math.max(1, ...assignees.map(a => getAssigneeLoad(a).active));
    html += '<div style="margin-top:10px;">';
    assignees.forEach(n => {
      const l = getAssigneeLoad(n);
      const p = Math.round((l.active / max) * 100);
      let bc = ''; if (p > 80) bc = 'danger'; else if (p > 50) bc = 'warn';
      html += '<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;"><span><strong>' + escapeHtml(n) + '</strong></span><span class="muted">' + l.active + ' активных / ' + l.total + ' всего</span></div><div class="load-bar"><div class="load-bar-fill ' + bc + '" style="width:' + p + '%;"></div></div></div>';
    });
    html += '</div>';
  }
  document.getElementById('statsContent').innerHTML = html;
}
